name: Documentation quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate local links and code fences
        run: python scripts/check_markdown.py
      - name: Install image validation dependency
        run: python -m pip install Pillow
      - name: Ensure PNG assets are optimized
        run: python scripts/optimize_images.py --check
